apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2                    # how many identical pods to keep running
  selector:
    matchLabels:
      app: account-service       # "the pods I manage are the ones with this label"
  template:                      # the pod blueprint — everything below describes ONE pod
    metadata:
      labels:
        app: account-service     # pods get stamped with this; MUST match the selector above
    spec:
      initContainers:
        # Block startup until Postgres is accepting connections, so the app's
        # Database.Migrate() on boot doesn't crash on "connection refused".
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -p 5432; do echo "waiting for postgres..."; sleep 2; done'
      containers:
        - name: account-service
          image: account-service:0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: account-db-secret
                  key: ConnectionStrings__Default