apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1                    # how many identical pods to keep running
  selector:
    matchLabels:
      app: account-service       # "the pods I manage are the ones with this label"
  template:                      # the pod blueprint — everything below describes ONE pod
    metadata:
      labels:
        app: account-service     # pods get stamped with this; MUST match the selector above
    spec:
      containers:
        - name: account-service
          image: account-service:0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080